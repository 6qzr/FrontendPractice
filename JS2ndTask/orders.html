<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Analytics Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Header -->
        <div class="mb-4">
            <h1 class="fw-bold">Order Analytics Dashboard</h1>
            <p class="text-muted">
                Analyze orders using JavaScript arrays, destructuring and object reshaping.
            </p>
        </div>

        <!-- Dashboard Summary -->
        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-muted">Total Revenue</h6>
                        <h3 id="totalRevenue">$0.00</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-muted">Pending</h6>
                        <h3 id="pendingCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-muted">Shipped</h6>
                        <h3 id="shippedCount">0</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-muted">Cancelled</h6>
                        <h3 id="cancelledCount">0</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- Highest Order -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <h5 class="card-title">Highest-Value Order</h5>

                <p class="mb-1">
                    Customer:
                    <strong id="highestCustomer">-</strong>
                </p>

                <p class="mb-0">
                    Amount:
                    <strong id="highestAmount">$0.00</strong>
                </p>
            </div>
        </div>

        <!-- Top Customers -->
        <div class="row g-4 mb-4">

            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h5>Top 3 Highest-Value Orders</h5>
                        <div id="topOrders"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h5>Customers With Orders Over $150</h5>
                        <ul id="uniqueCustomers" class="mb-0"></ul>
                    </div>
                </div>
            </div>

        </div>

        <!-- Controls -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">

                <div class="row g-3 align-items-end">

                    <div class="col-md-4">
                        <label for="statusFilter" class="form-label">
                            Filter by Status
                        </label>

                        <select id="statusFilter" class="form-select">
                            <option value="All">All</option>
                            <option value="Pending">Pending</option>
                            <option value="Shipped">Shipped</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="customerSearch" class="form-label">
                            Search Customer
                        </label>

                        <input
                            type="text"
                            id="customerSearch"
                            class="form-control"
                            placeholder="Search customer..."
                        >
                    </div>

                    <div class="col-md-4">
                        <div class="form-check form-switch">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="discountToggle"
                            >

                            <label
                                class="form-check-label"
                                for="discountToggle"
                            >
                                Preview 15% Off Everything
                            </label>
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <!-- Orders -->
        <div class="mb-3">
            <h4>Orders</h4>
        </div>

        <div id="orderList" class="row g-4"></div>

    </div>

    <script src="orders.js"></script>

</body>
</html>
