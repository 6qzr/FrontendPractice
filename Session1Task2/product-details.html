<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Results</title>
  </head>
  <body>
    <header id="top">
      <img
        src="img/my-market-logo-png.png"
        alt="MyMarket Logo"
        width="100"
        height="100"
      />
      <form action="" method="get">
        <input
          type="text"
          id="searchBox"
          name="q"
          placeholder="Search MyMarket"
        />
        <button type="submit">Search</button>
      </form>
      <!-- Language selection -->
      <a href="#">EN</a>
      <a href="#">Sign In</a>
      <a href="#">Cart</a>
    </header>
    <!-- Navigation bar -->
    <nav>
      <!-- Supposed to show a side menu of all categories-->
      <button type="button">All Categories</button>
      <a href="#">Electronics</a>
      <a href="#">Phones</a>
      <a href="#">Accessories</a>
    </nav>
    <main>
      <br />
      <!-- Navigate product related subcategories  -->
      <nav>
        <a href="search-results.html">Electronics</a>
        <a href="search-results.html">Camera & Photo</a>
        <a href="search-results.html">Digital Cameras</a>
        <a href="search-results.html">Point & Shoot</a>
      </nav>
      <!-- Main image -->
      <section id="gallery">
        <img
          src="https://picsum.photos/seed/camera-main/500"
          alt="LumaShot ZS9 compact camera, front view"
          width="500"
          height="500"
        />
        <!-- Thumbnails -->
        <div>
          <img
            src="https://picsum.photos/seed/camera-side/80"
            alt="LumaShot ZS9, side view"
            width="80"
            height="80"
          />
          <img
            src="https://picsum.photos/seed/camera-back/80"
            alt="LumaShot ZS9, back screen view"
            width="80"
            height="80"
          />
          <img
            src="https://picsum.photos/seed/camera-lens/80"
            alt="LumaShot ZS9, lens close-up"
            width="80"
            height="80"
          />
          <img
            src="https://picsum.photos/seed/camera-box/80"
            alt="LumaShot ZS9, box contents"
            width="80"
            height="80"
          />
        </div>
      </section>
      <section id="productInfo">
        <!-- Product brand, title, rating, and number of reviews -->
        <p>LumaTech</p>
        <h1>LumaShot ZS9 Compact Camera, 24-720mm Zoom</h1>
        <p>
          <a href="#reviews">
            <meter
              min="0"
              max="5"
              value="4.3"
              title="4.3 out of 5 stars"
            ></meter>
            4.3 out of 5 (2,847 ratings)
          </a>
        </p>
        <p>
          <span>$497.99</span>
          <s>$597.99</s>
          <span>Save $100.00 (17%)</span>
        </p>
        <!-- Variant selector -->
        <fieldset>
          <legend>Color</legend>
          <input
            type="radio"
            id="colorBlack"
            name="color"
            value="black"
            checked
          />
          <label for="colorBlack">Black</label>
          <input type="radio" id="colorSilver" name="color" value="silver" />
          <label for="colorSilver">Silver</label>
        </fieldset>
      </section>
    </main>
    <footer>
      <a href="#top">Back to top</a>
      <p>&copy; 2025 MyMarket. All rights reserved.</p>
    </footer>
  </body>
</html>
