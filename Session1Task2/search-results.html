<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Results</title>
  </head>
  <body>
    <header id="top">
      <img
        src="img/my-market-logo-png.png"
        alt="MyMarket Logo"
        width="100"
        height="100"
      />
      <form action="" method="get">
        <input
          type="text"
          id="searchBox"
          name="q"
          placeholder="Search MyMarket"
        />
        <button type="submit">Search</button>
      </form>
      <!-- Language selection -->
      <a href="#">EN</a>
      <a href="#">Sign In</a>
      <a href="#">Cart</a>
    </header>
    <!-- Navigation bar -->
    <nav>
      <br />
      <!-- Supposed to show a side menu of all categories-->
      <button type="button">All Categories</button>
      <a href="#">Electronics</a>
      <a href="#">Phones</a>
      <a href="#">Accessories</a>
    </nav>
    <main>
      <!-- Placeholder for the number pages and the number of results found -->
      <p>1–24 of over 1000 results for "search keyword"</p>
      <!-- Side menu with results filters -->
      <aside>
        <h2>Filters</h2>
        <fieldset>
          <legend>Shipping</legend>
          <input
            type="checkbox"
            id="freeShipping"
            name="shipping"
            value="free"
          />
          <label for="freeShipping">Free Shipping</label><br />
        </fieldset>
        <br />
        <fieldset>
          <legend>Price Range</legend>
          <label for="minPrice">Min</label>
          <input type="number" id="minPrice" name="minPrice" min="0" /><br />
          <label for="maxPrice">Max</label>
          <input type="number" id="maxPrice" name="maxPrice" min="0" /><br />
        </fieldset>
        <br />
        <!-- Placeholder for brand filters -->
        <fieldset>
          <legend>Brand</legend>
          <input type="checkbox" id="brandA" name="brand" value="brandA" />
          <label for="brandA">BrandA</label>
          <input type="checkbox" id="brandB" name="brand" value="brandB" />
          <label for="brandB">BrandB</label>
        </fieldset>
      </aside>
      <h1>Results</h1>
      <p>Here are the results for your search query.</p>
      <!-- Placeholder for pagination -->
      <nav>
        <a href="#">Previous</a>
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">Next</a>
      </nav>
    </main>
    <footer>
      <br />
      <a href="#top">Back to top</a>
      <p>&copy; 2025 MyMarket. All rights reserved.</p>
    </footer>
  </body>
</html>
