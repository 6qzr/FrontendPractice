<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Day 5 Demo - Inventory Utility</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .output {
        background: #1e1e2e;
        color: #d4d4e0;
        font-family: Consolas, monospace;
        font-size: 13px;
        padding: 12px 16px;
        border-radius: 6px;
        white-space: pre-wrap;
        min-height: 40px;
      }

      section {
        margin-bottom: 2.5rem;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">JavaScript Inventory Utility</span>
      </div>
    </nav>

    <main class="container py-4">
      <section id="demo-applied">
        <h2>Applied - Inventory Utility</h2>

        <p class="text-muted">
          Product inventory using classes, modules and array methods.
        </p>

        <!-- Summary -->
        <div class="row" id="totalInventoryValue"></div>

        <div class="row" id="stockBelowTen"></div>

        <!-- Controls -->
        <div class="mb-3 d-flex gap-2">
          <button id="lowStockToggle" class="btn btn-primary">
            Show Low Stock Only
          </button>

          <button id="discountToggle" class="btn btn-success">
            Apply 10% Discount
          </button>
        </div>

        <!-- Products -->
        <div id="productList" class="row"></div>
      </section>
    </main>

    <!-- IMPORTANT: module -->
    <script type="module" src="inventory.js"></script>
  </body>
</html>
